spring:
  application:
    name: tasker
  datasource:
    url: jdbc:sqlite:tasker.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  ai:
    mcp:
      server:
        enabled: true
        name: tasker-mcp
        version: 1.0.0
        type: SYNC
server:
  port: 8080
application:
  title: Tasker
  selected-user-id: 1
